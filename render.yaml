services:
  - type: web
    name: warp-asylum-server
    # Bun is provided by the JS/TS native runtime when a bun.lock is present
    runtime: node
    plan: free
    buildCommand: bun install && cd packages/database && bunx prisma generate
    startCommand: bun run packages/server/src/index.ts
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_OAUTH_CLIENT_ID
        sync: false
      - key: LOCAL_MODEL_BASE_URL
        sync: false